schema_version: "1.1"
id: reactive-resume
name: Reactive Resume
version: "5.3"
category: cms
description: "Self-hosted resume builder with real-time editing and client-side PDF rendering."

services:
  app:
    image: "amruthpillai/reactive-resume:v5.3.2"
    lifecycle: service
    trigger: http
    network: ingress
    ingress_port: 3000
    resources:
      memory: "512MiB"
      cpus: 0.5
    data_path: "/app/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

links:
  database:
    type: relational
    required: true
    supported_engines: ["postgres"]
    default_engine: postgres
    default_mode: dedicated
    env_mapping:
      host: DATABASE_HOST
      name: DATABASE_NAME
      user: DATABASE_USER
      password: DATABASE_PASSWORD

env:
  AUTH_SECRET:
    description: "Secret that signs authentication tokens."
    type: secret
    generate: random_base64_64
    required: true
  ENCRYPTION_SECRET:
    description: "Secret that encrypts saved AI agent workspace data."
    type: secret
    generate: random_base64_64
    required: true
  FLAG_DISABLE_SIGNUPS:
    description: "Disable public new user registration."
    type: boolean
    default: false
    required: false
