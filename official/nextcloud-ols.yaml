schemaVersion: "1.0"
id: "nextcloud-ols"
name: "Nextcloud Hub OpenLiteSpeed"
version: "30.0"
updatePolicy:
  line: "30.x"
category: "app"
publisher: "OpsKit"
resources:
  min:
    memory: "512MB"
    cpus: 0.5
  recommended:
    memory: "1GB"
    cpus: 1.0
description: "High-performance Nextcloud file sync & collaboration powered by OpenLiteSpeed LSPHP 8.4, MariaDB, and Redis memory caching."
tags:
  - "productivity"
  - "collaboration"
  - "cloud"
  - "nextcloud"
  - "php"

# Pinned sidecars tracking their own upstream lines, not the template version.
pins:
  nextcloud: "1.9.2-lsphp84"

inputs:
  domain:
    type: string
    required: true
    description: "Domain name for Nextcloud web interface"

links:
  database:
    engine: "mariadb"
    default: "dedicated"
  cache:
    engine: "redis"
    default: "dedicated"

hostpaths:
  - path: "config/config.php"
    containerPath: "/var/www/vhosts/localhost/html/config/config.php"
    kind: "file"
    editable: true
    description: "Nextcloud instance configuration"
  - path: "data"
    containerPath: "/var/www/vhosts/localhost/html/data"
    kind: "directory"
    description: "User file storage directory"

actions:
  status:
    description: "Show Nextcloud installation and database status"
    service: "nextcloud"
    workdir: "/var/www/vhosts/localhost/html"
    command: ["php", "occ", "status"]
  maintenance:
    description: "Enable or disable Nextcloud maintenance mode (input mode=on|off)"
    service: "nextcloud"
    workdir: "/var/www/vhosts/localhost/html"
    inputs:
      mode:
        description: "Maintenance mode state: 'on' or 'off'"
        default: "on"
        required: true
    command: ["php", "occ", "maintenance:mode", "--{{mode}}"]
  db-indices:
    description: "Add missing database indices"
    service: "nextcloud"
    workdir: "/var/www/vhosts/localhost/html"
    command: ["php", "occ", "db:add-missing-indices"]
  occ:
    description: "Run any Nextcloud occ command (arguments after --)"
    service: "nextcloud"
    workdir: "/var/www/vhosts/localhost/html"
    passthrough: true
    command: ["php", "occ"]

compose:
  services:
    nextcloud:
      image: "litespeedtech/openlitespeed:1.9.2-lsphp84"
      restart: "always"
      environment:
        MYSQL_HOST: "${DATABASE_HOST}:3306"
        MYSQL_DATABASE: "${DATABASE_NAME}"
        MYSQL_USER: "${DATABASE_USER}"
        MYSQL_PASSWORD: "${DATABASE_PASSWORD}"
        REDIS_HOST: "${REDIS_HOST}"
        REDIS_HOST_PASSWORD: "${REDIS_PASSWORD}"
        NEXTCLOUD_ADMIN_USER: "admin"
        NEXTCLOUD_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
        OVERWRITECLIURL: "https://${DOMAIN}"
      volumes:
        - "./config/config.php:/var/www/vhosts/localhost/html/config/config.php"
        - "./data:/var/www/vhosts/localhost/html/data"
        - "ols_conf:/usr/local/lsws/conf"
      networks:
        - "internal"

volumes:
  ols_conf:
    name: "opskit_${DEPLOYMENT_NAME}_ols_conf"

networks:
  internal:
    name: "opskit_${DEPLOYMENT_NAME}_net"
