schemaVersion: "1.0"
id: "laravel-ols"
name: "Laravel OpenLiteSpeed"
version: "11.x"
updatePolicy:
  line: "11.x"
category: "app"
publisher: "OpsKit"
resources:
  min:
    memory: "512MB"
    cpus: 0.5
  recommended:
    memory: "1GB"
    cpus: 1.0
description: "Blazing-fast Laravel PHP 8.4 runtime served by OpenLiteSpeed with native .htaccess rewrite, MariaDB, and Redis queue/cache."
tags:
  - "framework"
  - "php"
  - "laravel"
  - "api"
  - "openlitespeed"

# Pinned sidecars tracking their own upstream lines, not the template version.
pins:
  laravel: "1.9.2-lsphp84"

inputs:
  domain:
    type: string
    required: true
    description: "Domain name for Laravel application"

links:
  database:
    engine: "mariadb"
    default: "dedicated"
  cache:
    engine: "redis"
    default: "dedicated"

hostpaths:
  - path: "src"
    containerPath: "/var/www/vhosts/localhost/html"
    kind: "directory"
    description: "Laravel application source tree"
  - path: "config/.htaccess"
    containerPath: "/var/www/vhosts/localhost/html/public/.htaccess"
    kind: "file"
    editable: true
    description: "Public rewrite rules to index.php"
  - path: "config/php.ini"
    containerPath: "/usr/local/lsws/lsphp84/etc/php/8.4/mods-available/99-custom.ini"
    kind: "file"
    editable: true
    description: "PHP custom configuration overrides"
  - path: "storage/logs"
    containerPath: "/var/www/vhosts/localhost/html/storage/logs"
    kind: "directory"
    description: "Application log output directory"

tools:
  composer:
    service: "laravel"
    check: ["test", "-x", "/usr/local/bin/composer"]
    install:
      - "sh"
      - "-c"
      - "curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer"
    user: "0"

actions:
  migrate:
    description: "Run pending database migrations"
    service: "laravel"
    workdir: "/var/www/vhosts/localhost/html"
    command: ["php", "artisan", "migrate", "--force"]
  cache-clear:
    description: "Flush application, route, view, and config caches"
    service: "laravel"
    workdir: "/var/www/vhosts/localhost/html"
    command: ["php", "artisan", "optimize:clear"]
  optimize:
    description: "Cache configuration, routes, and views for production"
    service: "laravel"
    workdir: "/var/www/vhosts/localhost/html"
    command: ["php", "artisan", "optimize"]
  artisan:
    description: "Run any Laravel Artisan command (arguments after --)"
    service: "laravel"
    workdir: "/var/www/vhosts/localhost/html"
    passthrough: true
    command: ["php", "artisan"]
  composer:
    description: "Run Composer dependency commands (arguments after --)"
    service: "laravel"
    workdir: "/var/www/vhosts/localhost/html"
    requires: ["composer"]
    passthrough: true
    command: ["composer"]

compose:
  services:
    laravel:
      image: "litespeedtech/openlitespeed:1.9.2-lsphp84"
      restart: "always"
      environment:
        APP_NAME: "${DEPLOYMENT_NAME}"
        APP_ENV: "production"
        APP_KEY: "${APP_KEY}"
        APP_URL: "https://${DOMAIN}"
        DB_CONNECTION: "mysql"
        DB_HOST: "${DATABASE_HOST}"
        DB_PORT: "3306"
        DB_DATABASE: "${DATABASE_NAME}"
        DB_USERNAME: "${DATABASE_USER}"
        DB_PASSWORD: "${DATABASE_PASSWORD}"
        REDIS_HOST: "${REDIS_HOST}"
        REDIS_PASSWORD: "${REDIS_PASSWORD}"
      volumes:
        - "./src:/var/www/vhosts/localhost/html"
        - "./config/.htaccess:/var/www/vhosts/localhost/html/public/.htaccess"
        - "./config/php.ini:/usr/local/lsws/lsphp84/etc/php/8.4/mods-available/99-custom.ini:ro"
        - "./storage/logs:/var/www/vhosts/localhost/html/storage/logs"
        - "ols_conf:/usr/local/lsws/conf"
      networks:
        - "internal"

volumes:
  ols_conf:
    name: "opskit_${DEPLOYMENT_NAME}_ols_conf"

networks:
  internal:
    name: "opskit_${DEPLOYMENT_NAME}_net"
