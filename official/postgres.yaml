schema_version: "1.1"
id: postgres
name: PostgreSQL
version: "17.11"
category: datastore
description: "Relational database engine."

services:
  db:
    image: "postgres:17.11-alpine"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "256MiB"
    data_path: "/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

# The datastore's own provisioning recipe: the deploy platform
# executes it generically inside the running container to create one
# consumer's logical database and login user — no engine is
# special-cased in any binary. The command runs in the container's
# own shell, so its entries may reference the container's
# environment: `PGPASSWORD` is the documented libpq environment
# variable for the connection password
# (https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-ENVVAR),
# and `-v ON_ERROR_STOP=1` stops the script at the first failing
# statement so a refused grant never reads as success
# (https://www.postgresql.org/docs/current/app-psql.html). `postgres`
# is the superuser the official image creates by default
# (https://hub.docker.com/_/postgres). The generated consumer
# credential rides the script over standard input — the argv carries
# variable names only, never values.
provisioning:
  kind: relational
  exec: ["sh", "-c", "PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres"]
  # The create-if-absent steps use `\gexec` — the documented psql
  # meta-command that executes each row the current query returns as a
  # statement, so the create runs exactly when the entity is absent
  # (https://www.postgresql.org/docs/current/app-psql.html);
  # `CREATE DATABASE` cannot run inside a transaction block, and
  # `\gexec` executes the generated statement outside one. The
  # `ALTER ROLE` re-issues on every deploy, resetting the login
  # password to the freshly generated value — re-binding is idempotent
  # by construction. Scoped grants: the consumer's database revokes
  # `PUBLIC` connect and grants it to the login user alone, so one
  # shared instance's tenants cannot reach each other's data.
  # Identifiers are double-quoted per the lexical rules
  # (https://www.postgresql.org/docs/current/sql-syntax-lexical.html).
  script: |
    SELECT 'CREATE ROLE "{user}"' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{user}')\gexec
    ALTER ROLE "{user}" WITH LOGIN PASSWORD '{password}';
    SELECT 'CREATE DATABASE "{database}" OWNER "{user}"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{database}')\gexec
    REVOKE CONNECT ON DATABASE "{database}" FROM PUBLIC;
    GRANT CONNECT ON DATABASE "{database}" TO "{user}";
    GRANT ALL ON SCHEMA public TO "{user}";

env:
  POSTGRES_PASSWORD:
    description: "Superuser password."
    type: secret
    generate: random_base64_64
    required: true

# The datastore's own dump recipe: the platform executes it generically
# inside the running container to take one consumer's logical database
# out — and to import one back. The dump is written to a file inside
# the container and copied out byte-exactly with the engine's own
# copy-out command, so a binary archive never travels through a text
# channel. The postgres image ships the client tools beside the server
# (https://hub.docker.com/_/postgres), so `pg_dump` and `pg_restore`
# are already in the image.
#
# `-Fc` is the documented custom archive format, and `--no-owner` and
# `--no-privileges` keep the archive free of the ownership and the
# access-control statements, so the same archive restores into a
# different logical database under a different owner
# (https://www.postgresql.org/docs/current/app-pgdump.html). The
# restore counterpart takes the same two flags, and `--exit-on-error`
# stops at the first failing statement instead of continuing and
# reporting a count of errors at the end
# (https://www.postgresql.org/docs/current/app-pgrestore.html). The
# grants that follow the import give the consumer's own login user the
# privileges the imported objects need: the archive carries no owner,
# so the objects arrive owned by the superuser that restored them.
dump:
  exec: ["sh", "-c", "PGPASSWORD=\"$POSTGRES_PASSWORD\" pg_dump -Fc --no-owner --no-privileges -U postgres -d {database} -f /tmp/opskit-dump.dump"]
  restore_exec: ["sh", "-c", "PGPASSWORD=\"$POSTGRES_PASSWORD\" pg_restore --no-owner --no-privileges --exit-on-error -U postgres -d {database} /tmp/opskit-dump.dump && PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -v ON_ERROR_STOP=1 -U postgres -d {database} -f -"]
  restore_script: |
    GRANT ALL ON SCHEMA public TO "{user}";
    GRANT ALL ON ALL TABLES IN SCHEMA public TO "{user}";
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO "{user}";
