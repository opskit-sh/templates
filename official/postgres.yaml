schema_version: "1.1"
id: postgres
name: PostgreSQL
version: "17.11"
category: datastore
description: "Relational database engine."

services:
  db:
    image: "postgres:17.11-alpine"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "256MiB"
    data_path: "/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

env:
  POSTGRES_PASSWORD:
    description: "Superuser password."
    type: secret
    generate: random_base64_64
    required: true
