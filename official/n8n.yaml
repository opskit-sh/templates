schema_version: "1.1"
id: n8n
name: n8n
version: "2.43"
category: automation
description: "Workflow automation platform with a web editor and a PostgreSQL backend."

services:
  app:
    image: "docker.n8n.io/n8nio/n8n:2.43.0"
    lifecycle: service
    trigger: http
    network: ingress
    ingress_port: 5678
    resources:
      memory: "512MiB"
      cpus: 0.5
    data_path: "/home/node/.n8n"

links:
  database:
    type: relational
    required: true
    supported_engines: ["postgres"]
    default_engine: postgres
    default_mode: dedicated
    env_mapping:
      host: DB_POSTGRESDB_HOST
      name: DB_POSTGRESDB_DATABASE
      user: DB_POSTGRESDB_USER
      password: DB_POSTGRESDB_PASSWORD
  queue:
    type: key_value
    required: false
    supported_engines: ["redis"]
    default_engine: redis
    default_mode: dedicated
    env_mapping:
      host: QUEUE_BULL_REDIS_HOST
      password: QUEUE_BULL_REDIS_PASSWORD

env:
  N8N_ENCRYPTION_KEY:
    description: "Key that encrypts saved workflow credentials."
    type: secret
    generate: random_base64_64
    required: true
  DB_TYPE:
    description: "Database driver n8n uses for its backend."
    type: string
    default: postgresdb
    required: true
  NODE_ENV:
    description: "Node process environment."
    type: string
    default: production
    required: false
  GENERIC_TIMEZONE:
    description: "Timezone for scheduled workflow triggers (IANA name, e.g. Europe/Berlin)."
    type: string
    default: UTC
    required: false
  TZ:
    description: "Process timezone (IANA name)."
    type: string
    default: UTC
    required: false
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:
    description: "Restrict the settings file to its owning user."
    type: boolean
    default: true
    required: false
  N8N_COMMUNITY_PACKAGES_ENABLED:
    description: "Allow installing community nodes from the editor."
    type: boolean
    default: false
    required: false
  EXECUTIONS_DATA_PRUNE:
    description: "Prune past execution data automatically."
    type: boolean
    default: true
    required: false
  EXECUTIONS_DATA_MAX_AGE:
    description: "Retention period in hours for execution history."
    type: number
    default: 168
    required: false
