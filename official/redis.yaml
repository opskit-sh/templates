schema_version: "1.1"
id: redis
name: Redis
version: "7.4.11"
category: datastore
description: "In-memory data structure store used as a database, cache, and message broker."

services:
  db:
    image: "redis:7.4.11-alpine"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "64MiB"
      cpus: 0.1
    data_path: "/data"
