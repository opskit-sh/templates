schema_version: "1.1"
id: wordpress
name: WordPress
version: "6.7.1"
category: cms
description: "Web publishing platform and content management system."

stacks:
  default: ols
  available:
    ols:
      name: "OpenLiteSpeed + LSCache"
      description: "Event-driven LiteSpeed web server with native HTTP/3 and LSCache."
      services:
        app:
          image: "litespeedtech/openlitespeed:1.9.3-lsphp83"
          lifecycle: service
          trigger: http
          network: ingress
          ingress_port: 80
          resources:
            memory: "512MiB"
            cpus: 1.0
          data_path: "/var/www/html"
    lemp:
      name: "Nginx + PHP-FPM"
      description: "Traditional Nginx reverse proxy with PHP-FPM."
      services:
        app:
          image: "wordpress:6.7.1-fpm-alpine"
          lifecycle: service
          trigger: http
          network: ingress
          ingress_port: 80
          resources:
            memory: "512MiB"
            cpus: 1.0
          data_path: "/var/www/html"
        web:
          image: "nginx:1.27-alpine"
          lifecycle: service
          trigger: http
          network: ingress
          ingress_port: 80
          resources:
            memory: "128MiB"
            cpus: 0.25

links:
  database:
    type: relational
    required: true
    supported_engines: ["mariadb", "mysql"]
    default_engine: mariadb
    min_version: "10.11"
    default_mode: shared
    env_mapping:
      host: WORDPRESS_DB_HOST
      name: WORDPRESS_DB_NAME
      user: WORDPRESS_DB_USER
      password: WORDPRESS_DB_PASSWORD

hostpaths:
  - id: htaccess
    path: "configs/.htaccess"
    mount_target: "/var/www/html/.htaccess"
    mode: "0644"
    owner: "www-data:www-data"
    editable: true
    template_content: |
      # BEGIN WordPress
      RewriteEngine On
      RewriteBase /
      RewriteRule ^index\.php$ - [L]
      # END WordPress

tools:
  wp:
    binary: wp
    container: app
    run_as: www-data
    workdir: /var/www/html
    verify: ["wp", "--version"]
    global_args: ["--allow-root"]

actions:
  cache_flush:
    title: "Flush Object Cache"
    description: "Clears Redis/LSCache object caches."
    tool: wp
    args: ["cache", "flush"]
    danger: false
    category: maintenance

env:
  WORDPRESS_DEBUG:
    description: "Enable WordPress debug logging."
    type: boolean
    default: false
    required: false
