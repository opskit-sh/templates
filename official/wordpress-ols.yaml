schemaVersion: "1.0"
id: "wordpress-ols"
name: "WordPress OpenLiteSpeed"
version: "6.7"
updatePolicy:
  line: "6.x"
category: "app"
publisher: "OpsKit"
resources:
  min:
    memory: "512MB"
    cpus: 0.5
  recommended:
    memory: "1GB"
    cpus: 1.0
description: "Enterprise WordPress running on OpenLiteSpeed web server with LSPHP 8.4, HTTP/3 QUIC, and LiteSpeed Cache."
tags:
  - "cms"
  - "php"
  - "wordpress"
  - "openlitespeed"
  - "lscache"

# Pinned sidecars tracking their own upstream lines, not the template version.
pins:
  wordpress: "1.9.2-lsphp84"

inputs:
  domain:
    type: string
    required: true
    description: "Domain name for public exposure (e.g. blog.example.com)"
  admin_email:
    type: string
    required: true
    description: "WordPress administrator email address"
  site_title:
    type: string
    required: false
    default: "My WordPress Site"
    description: "Title of your WordPress website"
  admin_user:
    type: string
    required: false
    default: "admin"
    description: "WordPress administrator username"
  admin_password:
    type: string
    required: false
    description: "Custom admin password (leave empty to auto-generate secure secret)"
  multisite:
    type: string
    required: false
    default: "disabled"
    description: "Multisite network mode: disabled, subdomain, or subdirectory"

links:
  database:
    engine: "mariadb"
    default: "dedicated"
  cache:
    engine: "redis"
    default: "dedicated"

hostpaths:
  - path: "config/.htaccess"
    containerPath: "/var/www/vhosts/localhost/html/.htaccess"
    kind: "file"
    editable: true
    description: "Web server rewrite rules and caching directives"
  - path: "config/php.ini"
    containerPath: "/usr/local/lsws/lsphp84/etc/php/8.4/mods-available/99-custom.ini"
    kind: "file"
    editable: true
    description: "PHP custom configuration overrides"
  - path: "content/themes"
    containerPath: "/var/www/vhosts/localhost/html/wp-content/themes"
    kind: "directory"
    description: "WordPress themes directory"
  - path: "content/plugins"
    containerPath: "/var/www/vhosts/localhost/html/wp-content/plugins"
    kind: "directory"
    description: "WordPress plugins directory"
  - path: "uploads"
    containerPath: "/var/www/vhosts/localhost/html/wp-content/uploads"
    kind: "directory"
    description: "WordPress media uploads directory"

tools:
  wp-cli:
    service: "wordpress"
    check: ["test", "-x", "/usr/local/bin/wp"]
    install:
      - "sh"
      - "-c"
      - "curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x /usr/local/bin/wp"
    user: "0"

actions:
  install:
    description: "Run the WordPress installer (creates the site and admin account)"
    service: "wordpress"
    requires: ["wp-cli"]
    inputs:
      url:
        description: "Site URL (e.g. https://blog.example.com)"
        required: true
      title:
        description: "Site title"
        default: "My WordPress Site"
      admin_user:
        description: "Administrator username"
        default: "admin"
      admin_password:
        description: "Administrator password"
        required: true
        secret: true
      admin_email:
        description: "Administrator email"
        required: true
    command:
      - "wp"
      - "--path=/var/www/vhosts/localhost/html"
      - "core"
      - "install"
      - "--url={{url}}"
      - "--title={{title}}"
      - "--admin_user={{admin_user}}"
      - "--admin_password={{admin_password}}"
      - "--admin_email={{admin_email}}"
      - "--skip-email"
      - "--allow-root"
  info:
    description: "Show WordPress core and database versions"
    service: "wordpress"
    requires: ["wp-cli"]
    command: ["wp", "--path=/var/www/vhosts/localhost/html", "core", "version", "--extra", "--allow-root"]
  reset-password:
    description: "Reset a WordPress user's password"
    service: "wordpress"
    requires: ["wp-cli"]
    inputs:
      user:
        description: "Username, email or ID"
        default: "admin"
      password:
        description: "New password"
        required: true
        secret: true
    command:
      - "wp"
      - "--path=/var/www/vhosts/localhost/html"
      - "user"
      - "update"
      - "{{user}}"
      - "--user_pass={{password}}"
      - "--allow-root"
  cache-purge:
    description: "Flush LiteSpeed server cache and object caches"
    service: "wordpress"
    requires: ["wp-cli"]
    command: ["wp", "--path=/var/www/vhosts/localhost/html", "litespeed-purge", "all", "--allow-root"]
  wp:
    description: "Run any WP-CLI command (arguments after --)"
    service: "wordpress"
    requires: ["wp-cli"]
    passthrough: true
    command: ["wp", "--path=/var/www/vhosts/localhost/html", "--allow-root"]

compose:
  services:
    wordpress:
      image: "litespeedtech/openlitespeed:1.9.2-lsphp84"
      restart: "always"
      environment:
        WORDPRESS_DB_HOST: "${DATABASE_HOST}:3306"
        WORDPRESS_DB_USER: "${DATABASE_USER}"
        WORDPRESS_DB_PASSWORD: "${DATABASE_PASSWORD}"
        WORDPRESS_DB_NAME: "${DATABASE_NAME}"
        WORDPRESS_TABLE_PREFIX: "${WORDPRESS_TABLE_PREFIX:-wp_}"
        REDIS_HOST: "${REDIS_HOST}"
        REDIS_PORT: "6379"
        REDIS_PASSWORD: "${REDIS_PASSWORD}"
        DOMAIN: "${DOMAIN}"
        WORDPRESS_ADMIN_USER: "${WORDPRESS_ADMIN_USER:-admin}"
        WORDPRESS_ADMIN_PASSWORD: "${WORDPRESS_ADMIN_PASSWORD}"
        MULTISITE_MODE: "${MULTISITE_MODE:-disabled}"
      volumes:
        - "./config/.htaccess:/var/www/vhosts/localhost/html/.htaccess"
        - "./config/php.ini:/usr/local/lsws/lsphp84/etc/php/8.4/mods-available/99-custom.ini:ro"
        - "./content/themes:/var/www/vhosts/localhost/html/wp-content/themes"
        - "./content/plugins:/var/www/vhosts/localhost/html/wp-content/plugins"
        - "./uploads:/var/www/vhosts/localhost/html/wp-content/uploads"
        - "ols_conf:/usr/local/lsws/conf"
      networks:
        - "internal"

volumes:
  ols_conf:
    name: "opskit_${DEPLOYMENT_NAME}_ols_conf"

networks:
  internal:
    name: "opskit_${DEPLOYMENT_NAME}_net"
