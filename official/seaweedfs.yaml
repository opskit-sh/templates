schema_version: "1.1"
id: seaweedfs
name: SeaweedFS
version: "3.99"
category: datastore
description: "Distributed object store with an S3-compatible API and a Filer."

services:
  server:
    image: "chrislusf/seaweedfs:3.99"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "128MiB"
      cpus: 0.2
    data_path: "/data"

env:
  WEED_S3_ACCESS_KEY:
    description: "Access key id of the S3 API identity."
    type: secret
    generate: random_hex_16
    required: true
  WEED_S3_SECRET_KEY:
    description: "Secret access key of the S3 API identity."
    type: secret
    generate: random_base64_64
    required: true
