schema_version: "1.1"
id: seaweedfs
name: SeaweedFS
version: "3.99"
category: datastore
description: "Distributed object store with an S3-compatible API and a Filer."

services:
  server:
    image: "chrislusf/seaweedfs:3.99"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "128MiB"
      cpus: 0.2
    data_path: "/data"
