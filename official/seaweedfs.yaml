schema_version: "1.1"
id: seaweedfs
name: SeaweedFS
version: "4.48"
category: datastore
description: "Distributed object store with an S3-compatible API and a Filer."

services:
  server:
    image: "chrislusf/seaweedfs:4.48"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "128MiB"
      cpus: 0.2
    data_path: "/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
