schema_version: "1.1"
id: mariadb
name: MariaDB
version: "11.4.13"
category: datastore
description: "Open-source relational database server compatible with MySQL clients."

services:
  db:
    image: "mariadb:11.4.13"
    lifecycle: stateful
    state: persistent
    storage: persistent
    network: internal
    resources:
      memory: "256MiB"
      cpus: 0.25
    data_path: "/var/lib/mysql"

env:
  MARIADB_ROOT_PASSWORD:
    description: "Root account password."
    type: secret
    generate: random_base64_64
    required: true
